<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'">
<title>Borsa Pro</title>
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:400 12.5px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
::selection{background:var(--acc-soft)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--fg-3)}.m2{color:var(--fg-2)}
.app{display:grid;grid-template-rows:48px 1fr 26px;height:100vh}
/* ust cubuk */
.top{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s3) 0 84px;border-bottom:1px solid var(--line);background:var(--surface);-webkit-app-region:drag}
.top>*{-webkit-app-region:no-drag}
.brand{display:flex;align-items:center;gap:8px;font:600 13px var(--font);letter-spacing:.01em;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:5px;background:var(--acc);display:grid;place-items:center;color:var(--acc-ink)}
.srch{position:relative;width:250px;flex:none}
.srch input{width:100%;height:30px;padding:0 10px 0 30px;border:1px solid var(--line-2);border-radius:var(--r2);background:var(--bg);outline:none}
.srch input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.srch svg{position:absolute;left:9px;top:8px;color:var(--fg-3)}
.srch kbd{position:absolute;right:8px;top:6px;font:500 10.5px var(--mono);color:var(--fg-3);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.dd{position:absolute;left:0;right:0;top:34px;z-index:50;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r2);padding:4px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.dd.on{display:block}.dd div{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:4px;cursor:pointer}
.dd div.sel,.dd div:hover{background:var(--acc-soft)}.dd b{font:600 12px var(--mono);min-width:56px}.dd span{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:var(--s2)}
.tabs button{height:30px;padding:0 12px;border:0;border-radius:var(--r2);background:none;color:var(--fg-2);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--fg);background:var(--sunk)}.tabs button.on{color:var(--fg);background:var(--sunk);box-shadow:inset 0 -2px 0 var(--acc)}
.tabs button small{font:600 10px var(--mono);margin-left:5px;color:var(--acc)}
.sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;border:1px solid var(--line);font:500 11px var(--font);color:var(--fg-2);white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--fg-3)}.badge.open i{background:var(--up);box-shadow:0 0 0 3px var(--up-soft)}
/* govde */
.body{display:grid;grid-template-columns:220px 1fr;min-height:0}
.wl{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.wlh{display:flex;align-items:center;gap:6px;padding:10px 10px 6px}
.wlh b{font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);flex:1}
.ib{width:26px;height:26px;display:grid;place-items:center;border:0;border-radius:5px;background:none;color:var(--fg-2);cursor:pointer;flex:none}
.ib:hover{background:var(--sunk);color:var(--fg)}
.wladd{display:none;padding:0 10px 8px}.wladd.on{display:block}
.wladd input{width:100%;height:28px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--bg);outline:none;text-transform:uppercase}
.wll{overflow:auto;flex:1;padding:0 6px 8px}
.wr{display:grid;grid-template-columns:1fr 54px auto;grid-template-rows:auto auto;column-gap:6px;align-items:center;padding:6px 6px;border-radius:5px;cursor:pointer;position:relative}
.wr:hover{background:var(--sunk)}.wr.on{background:var(--acc-soft)}
.wr .c{font:600 12px var(--mono)}.wr .n{grid-column:1;font-size:10.5px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr svg{grid-row:1/3;grid-column:2}
.wr .p{text-align:right;font:500 12px var(--mono)}.wr .ch{grid-column:3;text-align:right;font:500 10.5px var(--mono)}
.wr .vd{position:absolute;left:-2px;top:9px;width:3px;height:16px;border-radius:2px}
.wr .x{position:absolute;right:2px;top:2px;display:none;border:0;background:var(--surface);color:var(--fg-3);border-radius:3px;width:16px;height:16px;line-height:14px;cursor:pointer;font-size:12px}
.wr:hover .x{display:block}
.view{display:none;min-height:0;min-width:0}.view.on{display:grid}
/* grafik gorunumu */
#v-grafik{grid-template-columns:minmax(0,1fr) 352px;grid-template-rows:minmax(0,1fr)}
.cw{display:grid;grid-template-rows:auto auto 1fr;min-width:0;min-height:0}
.sh{display:flex;align-items:center;gap:var(--s3);padding:10px 14px 6px;min-width:0}
.sh .sym{font:600 18px var(--mono);letter-spacing:.01em}.sh .nm{color:var(--fg-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;min-width:90px;flex:0 1 auto}
.sh .px{font:600 18px var(--mono)}.sh .chg{font:500 12.5px var(--mono);padding:2px 7px;border-radius:4px;white-space:nowrap}
.chg.up{background:var(--up-soft)}.chg.dn{background:var(--dn-soft)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r2);overflow:hidden;flex:none}
.seg button{height:26px;padding:0 9px;border:0;background:none;color:var(--fg-2);cursor:pointer;font:500 11.5px var(--mono)}
.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--acc);color:var(--acc-ink)}
.seg button:hover:not(.on){background:var(--sunk);color:var(--fg)}
.tb{display:flex;align-items:center;gap:6px;padding:0 14px 8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border:1px solid var(--line-2);border-radius:12px;background:none;color:var(--fg-2);cursor:pointer;font:500 11px var(--font);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:2px}
.chip.on{color:var(--fg);border-color:var(--fg-3);background:var(--sunk)}.chip:hover{color:var(--fg)}
.chip.sm{height:20px;padding:0 7px;font-size:10.5px;cursor:default}
.cbox{position:relative;margin:0 10px 10px 14px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);min-height:0;overflow:hidden}
#chart{position:absolute;inset:0}
.ovl{position:absolute;inset:0;display:none;place-items:center;z-index:5;background:color-mix(in oklch,var(--surface) 75%,transparent);text-align:center;padding:30px}
.ovl.on{display:grid}.ovl .t{font:600 14px var(--font);margin-bottom:6px}
.spin{width:22px;height:22px;border:2px solid var(--line-2);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
/* analiz paneli */
.ap{border-left:1px solid var(--line);overflow:auto;background:var(--surface);min-height:0;padding:12px 12px 24px}
.card{border:1px solid var(--line);border-radius:var(--r2);padding:12px;margin-bottom:10px;background:var(--bg)}
.card h3{margin:0 0 8px;font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);display:flex;align-items:center;gap:6px}
.card h3 .sp{flex:1}.card h3 a{font:500 11px var(--font);text-transform:none;letter-spacing:0;color:var(--acc);cursor:pointer}
.vc{display:flex;gap:12px;align-items:center}
.vl{min-width:92px;height:64px;border-radius:var(--r2);display:grid;place-items:center;align-content:center;color:var(--bg)}
.vl b{font:700 24px var(--mono);letter-spacing:.04em;line-height:1}.vl small{font:600 11px var(--mono);opacity:.85;margin-top:4px}
.vl.AL{background:var(--up)}.vl.SAT{background:var(--dn)}.vl.BEKLE{background:var(--acc);color:var(--acc-ink)}
.gauge{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--dn) 0,var(--dn-soft) 40%,var(--line) 50%,var(--up-soft) 60%,var(--up) 100%);margin:8px 0 3px}
.gauge i{position:absolute;top:-4px;width:3px;height:14px;border-radius:2px;background:var(--fg);transform:translateX(-50%)}
.gl{display:flex;justify-content:space-between;font:500 9.5px var(--mono);color:var(--fg-3)}
.why{margin:10px 0 0;padding:0;list-style:none}.why li{position:relative;padding:3px 0 3px 14px;color:var(--fg-2)}
.why li:before{content:'';position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--fg-3)}
.disc{font-size:10.5px;color:var(--fg-3);margin-top:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.kv>span{color:var(--fg-2);font-size:12px}.kv>b{font:500 12px var(--mono);text-align:right}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv{border:1px solid var(--line);border-radius:5px;padding:6px 8px}.pv span{display:block;font-size:10.5px;color:var(--fg-3)}.pv b{font:600 13px var(--mono)}
.cap{display:flex;gap:6px;align-items:center;margin-top:10px}
.inp{height:28px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--surface);outline:none;min-width:0}
.inp:focus{border-color:var(--acc)}
.btn{height:28px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--surface);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--fg-3)}.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.btn.pri:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.5;cursor:default}
.warn{margin-top:8px;padding:7px 9px;border-radius:5px;background:var(--acc-soft);color:var(--fg);font-size:11.5px}
.err{padding:8px 10px;border-radius:5px;background:var(--dn-soft);color:var(--fg);font-size:12px}
.cmp{display:grid;grid-template-columns:96px 1fr 38px;gap:4px 8px;align-items:center;font-size:11.5px}
.cmp .bar{position:relative;height:6px;background:var(--sunk);border-radius:3px}.cmp .bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.cmp .bar:after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line-2)}
.cmp b{font:500 11px var(--mono);text-align:right}
.lv{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer}.lv:hover{background:var(--sunk)}
.lv .tg{font:600 10.5px var(--mono);width:24px}.lv .r{flex:1;font:500 12px var(--mono)}.lv small{color:var(--fg-3);font-size:10.5px}
.lv .now{flex:1;text-align:center;font:600 11px var(--mono);color:var(--acc);border-top:1px dashed var(--acc);padding-top:1px}
.tfs{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;font-size:12px}.tfs span{color:var(--fg-3)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.news a{display:block;padding:6px 0;border-top:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:12px;cursor:pointer}
.news a:first-child{border-top:0}.news a:hover{color:var(--acc)}.news small{display:block;color:var(--fg-3);font-size:10.5px;margin-top:1px}
.sc{display:inline-block;min-width:22px;text-align:center;font:600 10px var(--mono);border-radius:3px;padding:0 3px;margin-right:6px}
.ai p{margin:0 0 8px;color:var(--fg)}.ai h4{margin:10px 0 3px;font:600 11.5px var(--font)}.ai ul{margin:0;padding-left:16px;color:var(--fg-2)}.ai li{margin:2px 0}
.chat{display:flex;flex-direction:column;gap:6px;margin-top:8px}.msg{padding:7px 9px;border-radius:6px;font-size:12px;white-space:pre-wrap}
.msg.u{background:var(--acc-soft);align-self:flex-end;max-width:90%}.msg.a{background:var(--sunk)}
.row{display:flex;gap:6px;align-items:center}
/* tablo gorunumleri */
.pg{overflow:auto;padding:14px 18px 30px;min-height:0}
.view.pg.on{display:block}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ph h2{margin:0;font:600 16px var(--font);margin-right:8px}
.prog{flex:1;min-width:120px;max-width:320px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{position:sticky;top:-14px;z-index:1;background:var(--bg);text-align:right;font:600 10.5px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3);padding:7px 8px;border-bottom:1px solid var(--line-2);cursor:pointer;white-space:nowrap;user-select:none}
table.t th:first-child,table.t td:first-child{text-align:left}table.t th.s{color:var(--fg)}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font:500 12px var(--mono);white-space:nowrap}
table.t tbody tr{cursor:pointer}table.t tbody tr:hover{background:var(--sunk)}table.t tr.best{background:var(--acc-soft)}
.vb{display:inline-block;min-width:46px;text-align:center;font:700 10.5px var(--mono);padding:2px 0;border-radius:3px;color:var(--bg)}
.vb.AL{background:var(--up)}.vb.SAT{background:var(--dn)}.vb.BEKLE{background:var(--line-2);color:var(--fg)}
.tags{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-start}.tag{font:500 10px var(--font);padding:1px 6px;border-radius:9px;border:1px solid var(--line-2);color:var(--fg-2)}
.tag.p{border-color:var(--up);color:var(--up)}.tag.n{border-color:var(--dn);color:var(--dn)}
.empty{padding:40px 20px;text-align:center;color:var(--fg-2)}.empty b{display:block;color:var(--fg);font-size:14px;margin-bottom:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mc{border:1px solid var(--line);border-radius:var(--r2);padding:12px;background:var(--surface)}
.mc span{color:var(--fg-2);font-size:12px}.mc b{display:block;font:600 18px var(--mono);margin:2px 0}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);margin-bottom:12px}
.form label{font-size:11px;color:var(--fg-3)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0 14px;background:var(--sunk)}
.sb{display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--line);font-size:11px;color:var(--fg-3);background:var(--surface);white-space:nowrap;overflow:hidden}
.toast{position:fixed;left:50%;top:56px;transform:translateX(-50%) translateY(-8px);opacity:0;pointer-events:none;transition:.15s;z-index:99;padding:9px 14px;border-radius:var(--r2);background:var(--fg);color:var(--bg);font-weight:500;max-width:60vw}
.toast.on{opacity:1;transform:translateX(-50%)}.toast.al{background:var(--acc);color:var(--acc-ink)}
.eq{width:100%;height:220px;display:block}
/* analist */
.ag{display:grid;gap:12px;margin-bottom:12px}.ag3{grid-template-columns:1.1fr 1fr 1fr}.ag2{grid-template-columns:1fr 1fr}
.ag .card{margin:0;background:var(--surface)}.ag .kv{grid-template-columns:minmax(118px,max-content) 1fr}
.note{display:flex;gap:14px;align-items:center}.note .nl{min-width:118px;height:76px;border-radius:var(--r2);display:grid;place-items:center;align-content:center;font:700 19px var(--font);color:var(--bg);text-align:center;padding:0 8px}
.n4{background:var(--up)}.n3{background:color-mix(in srgb,var(--up) 70%,var(--surface))}.n2{background:var(--acc);color:var(--acc-ink)!important}.n1{background:color-mix(in srgb,var(--dn) 70%,var(--surface))}.n0{background:var(--dn)}
.drv{margin:10px 0 0;padding:0;list-style:none}.drv li{padding:3px 0 3px 16px;position:relative;color:var(--fg-2);font-size:12px}
.drv li:before{position:absolute;left:0;top:3px;font:700 12px var(--mono)}.drv li.p:before{content:'+';color:var(--up)}.drv li.n:before{content:'−';color:var(--dn)}.drv li.z:before{content:'·';color:var(--fg-3)}
.big{font:600 22px var(--mono)}.rbar{position:relative;height:30px;margin:14px 4px 4px}
.rbar .ln{position:absolute;left:0;right:0;top:14px;height:2px;background:var(--line-2)}.rbar .b68{position:absolute;top:8px;height:14px;border-radius:3px;background:var(--acc-soft);border:1px solid var(--acc)}
.rbar .mk{position:absolute;top:2px;width:2px;height:26px;transform:translateX(-1px)}.rbar .mk span{position:absolute;top:28px;left:50%;transform:translateX(-50%);font:500 10px var(--mono);white-space:nowrap;color:var(--fg-2)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 6px;background:var(--sunk)}.stack i{display:block;height:100%}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fg-2)}.leg b{font:600 12px var(--mono);color:var(--fg)}
.lab3{font:600 11px var(--font);padding:2px 8px;border-radius:9px;white-space:nowrap}
.l4{background:var(--up);color:var(--bg)}.l3{background:var(--up-soft);color:var(--up)}.l2{background:var(--sunk);color:var(--fg-2)}.l1{background:var(--dn-soft);color:var(--dn)}.l0{background:var(--dn);color:var(--bg)}
.mstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:6px}.mstrip div{border-radius:4px;padding:6px 1px;text-align:center;font:500 9.5px var(--mono);white-space:nowrap;overflow:hidden}
.mstrip div b{display:block;font:600 10.5px var(--font);margin-bottom:2px}.mstrip .cur{outline:2px solid var(--acc);outline-offset:-1px}
.rep h4{margin:12px 0 4px;font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}.rep ul{margin:0;padding-left:16px}.rep li{margin:3px 0;line-height:1.5}
.scn{display:grid;grid-template-columns:1fr 54px;gap:4px 10px;align-items:center;margin:4px 0}.scn .bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}.scn .bar i{display:block;height:100%}
@media print{body,html{overflow:visible;height:auto;background:#fff;color:#000}.top,.wl,.sb,#tabs,.noprint,.toast{display:none!important}.app,.body{display:block;height:auto}
  .view{display:none!important}#v-analist{display:block!important;overflow:visible}.card{break-inside:avoid}}
@media(max-width:1200px){.body{grid-template-columns:196px 1fr}#v-grafik{grid-template-columns:1fr 318px}.srch{width:200px}.tabs button{padding:0 9px}}
@media(max-width:1180px){.sh .nm{display:none}.tb>.mu{display:none}.chip{padding:0 7px;height:22px;font-size:10.5px}.sh{flex-wrap:wrap;row-gap:6px}
  #v-grafik{grid-template-columns:minmax(0,1fr) 300px}.pv b{font-size:12px}.vl{min-width:78px}.ap{padding:10px 10px 24px}}
@media(max-width:1100px){.brand span{display:none}.badge span{display:none}.body{grid-template-columns:180px 1fr}.wr svg{display:none}.wr{grid-template-columns:1fr auto}}
</style>

</header>
<div class="body">
  <aside class="wl">
    <div class="wlh"><b>İzleme listesi</b><button class="ib" id="wlp" title="Hisse ekle"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button></div>
    <div class="wladd" id="wla"><input id="wli" placeholder="Kod yaz, Enter" spellcheck="false" autocomplete="off"></div>
    <div class="wll" id="wll"></div>
  </aside>
  <main style="min-height:0;min-width:0;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)">

      <div class="cw">
        <div class="sh" id="sh"></div>
        <div class="tb" id="tb"></div>
        <div class="cbox"><div id="chart"></div><div class="ovl" id="ovl"></div></div>
      </div>
      <div class="ap" id="ap"></div>
    </section>
    <section class="view pg" id="v-analist"></section>
    <section class="view pg" id="v-tarama"></section>
    <section class="view pg" id="v-lab"></section>
    <section class="view pg" id="v-portfoy"></section>
    <section class="view pg" id="v-alarm"></section>
    <section class="view pg" id="v-piyasa"></section>
  </main>
</div>
<footer class="sb"><span id="sbl">Veri: Yahoo Finance · BIST ~15 dk gecikmeli</span><span class="sp"></span><span id="sbr"></span><span>Teknik analiz çıktısıdır, yatırım tavsiyesi değildir.</span></footer>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
// replaceChildren/append: kosullu (null/false) cocuklar "null" yazisi olarak eklenmesin, ic ice diziler acilsin
for(const k of ['replaceChildren','append']){const f=Element.prototype[k];Element.prototype[k]=function(...a){return f.apply(this,a.flat(9).filter(x=>x!=null&&x!==false))}}
// window.bp: preload (contextBridge) verir; ayni adla yeniden tanimlanamaz
// --- yardimcilar -----------------------------------------------------------------------
function el(tag,attrs,...kids){const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;
    else if(k.startsWith('on'))e[k]=v;else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat(9))if(c!=null&&c!==false)e.append(c&&c.nodeType?c:document.createTextNode(String(c)));
  return e}
const fin=v=>typeof v==='number'&&Number.isFinite(v);
const nf=(v,d=2)=>fin(v)?v.toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const fp=v=>fin(v)?nf(v,Math.abs(v)>=1?2:4):'—';
const pct=(v,d=2)=>fin(v)?(v>0?'+':v<0?'−':'')+'%'+nf(Math.abs(v),d):'—';
const sgnc=v=>fin(v)?(v>0?'up':v<0?'dn':''):'';
const big=v=>{if(!fin(v))return '—';const a=Math.abs(v);return a>=1e9?nf(v/1e9,2)+' Mr':a>=1e6?nf(v/1e6,2)+' Mn':a>=1e3?nf(v/1e3,1)+' B':nf(v,0)};
const tl=v=>fin(v)?nf(v,2)+' ₺':'—';
const TFN={'1dk':'1 dk','5dk':'5 dk','15dk':'15 dk','1s':'Saatlik','1g':'Günlük','1h':'Haftalık'};
const TFS=['5dk','15dk','1s','1g','1h'];
const hm=t=>fin(t)?new Date(t).toLocaleTimeString('tr-TR',{timeZone:'Europe/Istanbul',hour:'2-digit',minute:'2-digit'}):'';
const dt=t=>{if(!t)return '';const d=new Date(typeof t==='number'?t:Date.parse(t));return isNaN(d)?'':d.toLocaleString('tr-TR',{timeZone:'Europe/Istanbul',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
const day=t=>fin(t)?new Date(t).toLocaleDateString('tr-TR',{timeZone:'Europe/Istanbul',day:'numeric',month:'short',year:'numeric'}):'—';
function spark(vals,w=54,h=22,color){
  const v=(vals||[]).filter(fin),s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',w);s.setAttribute('height',h);s.setAttribute('viewBox','0 0 '+w+' '+h);
  if(v.length<2)return s;const mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
  const pts=v.map((x,i)=>(i/(v.length-1)*(w-2)+1).toFixed(1)+','+(h-2-(x-mn)/r*(h-4)).toFixed(1)).join(' ');
  const c=color||(v[v.length-1]>=v[0]?'var(--up)':'var(--dn)');
  s.innerHTML='<polyline fill="none" stroke="'+c+'" stroke-width="1.3" stroke-linejoin="round" points="'+pts+'"/>';return s}
let toastT;function toast(t,kind){const e=$('toast');e.textContent=t;e.className='toast on'+(kind?' '+kind:'');clearTimeout(toastT);toastT=setTimeout(()=>e.className='toast',kind==='al'?6000:2400)}
const okr=r=>r&&r.ok!==false;
async function call(f,...a){try{const r=await f(...a);if(r&&r.ok===false&&r.error)toast(r.error);return r}catch(e){toast('Hata: '+(e&&e.message||e));return null}}

// --- durum -------------------------------------------------------------------------------
const S={st:null,sym:null,tf:'1g',mkt:'BIST',data:null,q:new Map(),scan:null,preset:null,sort:{k:'score',d:-1},lab:null,labSel:null,ai:null,chat:[],tab:'grafik',
  show:{},loading:0,trades:null,provider:'auto'};
const verdictOf=sym=>{const r=S.scan&&S.scan.rows&&S.scan.rows.find(x=>x.symbol===sym);return r&&r.verdict||null};
let ch=null;
const dark=()=>matchMedia('(prefers-color-scheme: dark)').matches;
function chartInit(){
  if(ch)return ch;
  if(!window.BPChart||!window.LightweightCharts){ovl('Grafik bileşeni yüklenemedi','Uygulamayı yeniden başlatmayı dene.');return null}
  try{ch=BPChart.create($('chart'),{theme:dark()?'dark':'light',show:S.show});
    ch.onClickPrice(p=>{if(!S.data)return;const last=S.data.quote&&S.data.quote.price;addAlarm(S.data.symbol,fin(last)&&p<last?'below':'above',p)});
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>ch&&ch.setTheme(dark()?'dark':'light'));
  }catch(e){ovl('Grafik açılamadı',String(e.message||e));ch=null}
  return ch}
function ovl(t,s,spin){const o=$('ovl');if(!t){o.className='ovl';return}o.className='ovl on';o.replaceChildren(el('div',{},spin?el('div',{class:'spin'}):null,el('div',{class:'t'},t),s?el('div',{class:'m2'},s):null))}

// --- ust cubuk: arama -------------------------------------------------------------------
let ddSel=0,ddItems=[],sT;
const q=$('q');
q.addEventListener('input',()=>{clearTimeout(sT);sT=setTimeout(doSearch,90)});
q.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!ddItems.length)return;ddSel=(ddSel+(e.key==='ArrowDown'?1:-1)+ddItems.length)%ddItems.length;drawDD()}
  else if(e.key==='Enter'){e.preventDefault();const it=ddItems[ddSel],v=it?it.symbol:q.value.trim();if(v){go(v);q.value='';closeDD();q.blur()}}
  else if(e.key==='Escape'){q.value='';closeDD();q.blur()}});
q.addEventListener('blur',()=>setTimeout(closeDD,150));
async function doSearch(){const v=q.value.trim();if(!v){closeDD();return}
  let r=[];try{r=await bp.search(v)}catch(e){}
  ddItems=Array.isArray(r)?r:[];if(!ddItems.length&&/^[a-zçğıöşü0-9]{2,8}$/i.test(v))ddItems=[{symbol:v.toLocaleUpperCase('tr-TR'),name:'Kodu doğrudan aç'}];ddSel=0;drawDD()}
function drawDD(){const d=$('dd');d.replaceChildren(...ddItems.map((x,i)=>el('div',{class:i===ddSel?'sel':'',onmousedown:e=>{e.preventDefault();go(x.symbol);q.value='';closeDD();q.blur()}},el('b',{},x.symbol),el('span',{},x.name||''))));d.classList.toggle('on',ddItems.length>0)}
function closeDD(){$('dd').classList.remove('on');ddItems=[]}
document.addEventListener('keydown',e=>{
  const a=document.activeElement,typing=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();q.focus();return}
  if(/^[1-5]$/.test(e.key)&&S.tab==='grafik'){setTf(TFS[+e.key-1]);return}
  if((e.key==='ArrowDown'||e.key==='ArrowUp')&&S.st){const w=S.st.watch,i=w.indexOf(S.sym);if(!w.length)return;e.preventDefault();
    go(w[(i+(e.key==='ArrowDown'?1:-1)+w.length)%w.length]);return}
  if(/^[a-zA-ZçğıöşüÇĞİÖŞÜ]$/.test(e.key)){q.focus()}});

// --- sekmeler ------------------------------------------------------------------------------
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)tab(b.dataset.v)};
function tab(v){S.tab=v;for(const b of $('tabs').children)b.classList.toggle('on',b.dataset.v===v);
  for(const s of document.querySelectorAll('.view'))s.classList.toggle('on',s.id==='v-'+v);
  if(v==='grafik'&&ch)requestAnimationFrame(()=>ch.resize());
  ({analist:renderAnalyst,tarama:renderScan,lab:renderLab,portfoy:loadPort,alarm:renderAlarms,piyasa:loadOverview})[v]?.();
  bp.prefs({tab:v}).catch(()=>{})}

// --- izleme listesi -------------------------------------------------------------------------
$('wlp').onclick=()=>{$('wla').classList.toggle('on');if($('wla').classList.contains('on'))$('wli').focus()};
$('wli').addEventListener('keydown',async e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(!v)return;const r=await call(bp.watch,{op:'add',symbol:v});
  if(okr(r)){S.st.watch=r.watch;e.target.value='';renderWatch();refreshQuotes()}}else if(e.key==='Escape'){$('wla').classList.remove('on')}});
function renderWatch(){
  const w=S.st?S.st.watch:[];
  if(!w.length){$('wll').replaceChildren(el('div',{class:'empty',style:'padding:20px 8px'},el('b',{},'Liste boş'),'+ ile hisse ekle.'));return}
  $('wll').replaceChildren(...w.map(s=>{const x=S.q.get(s)||{},v=verdictOf(s);
    return el('div',{class:'wr'+(s===S.sym?' on':''),onclick:()=>go(s),title:x.name||s},
      v?el('i',{class:'vd',style:'background:'+(v.label==='AL'?'var(--up)':v.label==='SAT'?'var(--dn)':'var(--line-2)'),title:'Son tarama: '+v.label}):null,
      el('span',{class:'c'},s),spark(x.spark),el('span',{class:'p'},fp(x.price)),
      el('span',{class:'n'},x.error?'veri yok':x.name||''),el('span',{class:'ch '+sgnc(x.chgPct)},pct(x.chgPct)),
      el('button',{class:'x',title:'Listeden çıkar',onclick:async e=>{e.stopPropagation();const r=await call(bp.watch,{op:'remove',symbol:s});if(okr(r)){S.st.watch=r.watch;renderWatch()}}},'×'))}))}
let qBusy=false;
async function refreshQuotes(){
  if(qBusy||!S.st||!S.st.watch.length||document.hidden)return;
  // Seans kapaliyken fiyat degismez: tum listenin fiyati bir kez alindiysa tekrar sorma (pil ve istek tasarrufu)
  if(S.st.marketStatus&&!S.st.marketStatus.open&&S.st.market!=='US'&&S.st.watch.every(s=>S.q.has(s)))return;qBusy=true;
  try{const r=await bp.quotes(S.st.watch);if(Array.isArray(r))for(const x of r)if(x&&x.symbol)S.q.set(x.symbol,x);renderWatch();
    $('sbr').textContent='Fiyatlar '+hm(Date.now());}catch(e){}finally{qBusy=false}}

// --- grafik + analiz -------------------------------------------------------------------------
function go(sym){if(S.tab!=='grafik')tab('grafik');load(sym)}
function setTf(tf){if(!TFS.includes(tf)||tf===S.tf&&S.data)return;S.tf=tf;if(S.sym)load(S.sym)}
async function load(sym,o={}){
  if(!sym)return;const seq=++S.loading;S.sym=String(sym).toLocaleUpperCase('tr-TR');renderWatch();renderHead();
  if(chartInit())ovl(S.sym+' yükleniyor…',TFN[S.tf]+' veri ve analiz',true);
  let r;try{r=await bp.load({symbol:S.sym,tf:S.tf,market:S.mkt})}catch(e){r={ok:false,error:String(e.message||e)}}
  if(seq!==S.loading)return;
  if(!r||!r.ok){S.data=null;ovl('Veri alınamadı',(r&&r.error)||'Bağlantıyı kontrol et.');renderHead();renderAnalysis();return}
  S.data=r;S.sym=r.symbol;S.ai=null;S.chat=[];if(!o.keepTrades)S.trades=null;
  ovl(null);renderHead();renderWatch();drawChart();renderAnalysis();if(S.tab==='analist')renderAnalyst();
  $('sbl').textContent='Veri: Yahoo Finance'+(r.market==='BIST'?' · BIST ~15 dk gecikmeli':'')+(r.stale?' · çevrimdışı, eski veri':'')+(r.errors&&r.errors.length?' · '+r.errors.length+' uyarı':'')}
function drawChart(){
  const r=S.data;if(!r||!chartInit())return;
  const alarms=(S.st.alarms||[]).filter(a=>a.symbol===r.symbol&&a.kind!=='verdict'&&!a.fired);
  const positions=((S.st.portfolio&&S.st.portfolio.positions)||[]).filter(p=>p.symbol===r.symbol);
  ch.setData({rows:r.rows,tf:r.tf,pro:r.pro,signals:r.signals,symbol:r.symbol,alarms,positions,trades:S.trades,show:{...S.show,trades:!!S.trades}})}
const IND=[['ema','EMA 20/50','var(--acc)'],['ema200','EMA 200','#a77cf0'],['bb','Bollinger','#8c9bb4'],['vwap','VWAP','#f0894b'],['volume','Hacim',null],['rsi','RSI',null],['macd','MACD',null],
  ['levels','Seviyeler',null],['plan','Plan',null],['signals','AL/SAT',null],['trendlines','Trend çizgileri',null],['profile','Hacim profili',null]];
function renderHead(){
  const r=S.data,qt=r&&r.quote||{};
  $('sh').replaceChildren(el('span',{class:'sym'},S.sym||'—'),el('span',{class:'nm'},r?r.name||'':''),
    r?el('span',{class:'px'},fp(qt.price)):null,r&&fin(qt.chgPct)?el('span',{class:'chg '+sgnc(qt.chgPct)},pct(qt.chgPct)):null,
    r&&qt.stale?el('span',{class:'badge',title:'Bağlantı yok; son bilinen veri'},'eski veri'):null,
    el('span',{class:'sp'}),
    el('div',{class:'seg'},...TFS.map((t,i)=>el('button',{class:t===S.tf?'on':'',title:TFN[t]+' ('+(i+1)+')',onclick:()=>setTf(t)},t))),
    el('div',{class:'seg'},...['BIST','US'].map(m=>el('button',{class:m===S.mkt?'on':'',onclick:()=>{if(m!==S.mkt){S.mkt=m;bp.prefs({market:m}).catch(()=>{});if(S.sym)load(S.sym)}}},m==='US'?'ABD':m))),
    el('button',{class:'btn',title:'Bu hisseyi izleme listesine ekle',onclick:async()=>{const x=await call(bp.watch,{op:'add',symbol:S.sym});if(okr(x)){S.st.watch=x.watch;renderWatch();refreshQuotes();toast(S.sym+' izleme listesinde')}}},'+ Liste'),
    el('button',{class:'btn',title:'Grafiği yenile',onclick:()=>S.sym&&load(S.sym,{keepTrades:true})},'Yenile'));
  const sh=ch?ch.getShow():S.show;
  $('tb').replaceChildren(...IND.map(([k,n,c])=>{const on=k==='vwap'?sh.vwap===true||(sh.vwap==='auto'&&['5dk','15dk','1dk'].includes(S.tf)):!!sh[k];
    return el('button',{class:'chip'+(on?' on':''),onclick:()=>toggleShow(k,on)},c?el('i',{style:'background:'+c}):null,n)}),
    S.trades?el('button',{class:'chip on',onclick:()=>{S.trades=null;drawChart();renderHead()}},'Strateji işlemleri ×'):null,
    el('span',{class:'mu',style:'margin-left:auto;font-size:11px'},'Alt+tık: alarm · tekerlek: yakınlaştır'))}
function toggleShow(k,on){const v=k==='vwap'?(on?false:true):!on;S.show={...S.show,[k]:v};if(ch)ch.setShow({[k]:v});bp.prefs({show:{[k]:v}}).catch(()=>{});renderHead()}

const CARD=(title,...kids)=>el('div',{class:'card'},el('h3',{},...[].concat(title)),...kids);
function renderAnalysis(){
  const ap=$('ap'),r=S.data;
  if(!r){ap.replaceChildren(el('div',{class:'empty'},el('b',{},S.sym?'Analiz yok':'Hisse seç'),S.sym?'Veri alınamadı; bağlantını kontrol edip Yenile\'ye bas.':'Soldaki listeden ya da üstteki aramadan bir hisse aç.'));return}
  const P=r.pro&&r.pro.ok?r.pro:null,out=[];
  if(!P){out.push(el('div',{class:'err'},'Gelişmiş analiz yapılamadı: '+((r.pro&&r.pro.error)||'yeterli veri yok')+'. Daha uzun bir zaman dilimi dene (Günlük).'))}
  else{
    const V=P.verdict;
    out.push(CARD(['Karar',el('span',{class:'sp'}),el('span',{class:'mu',style:'text-transform:none;letter-spacing:0;font-weight:500'},TFN[r.tf]+' · '+P.n+' mum')],
      el('div',{class:'vc'},el('div',{class:'vl '+V.label},el('b',{},V.label),el('small',{},(V.score>0?'+':'')+V.score)),
        el('div',{style:'flex:1;min-width:0'},el('div',{class:'kv'},el('span',{},'Skor'),el('b',{class:sgnc(V.score)},(V.score>0?'+':'')+V.score+' / 100'),
          el('span',{},'Güven'),el('b',{},'%'+V.confidence)),
          el('div',{class:'gauge'},el('i',{style:'left:'+((V.score+100)/2)+'%'})),el('div',{class:'gl'},el('span',{},'SAT −100'),el('span',{},'0'),el('span',{},'+100 AL')))),
      V.reasons&&V.reasons.length?el('ul',{class:'why'},...V.reasons.map(t=>el('li',{},t))):null,
      el('div',{class:'disc'},'Teknik analiz çıktısıdır, yatırım tavsiyesi değildir.')));
    const QR=r.quant&&r.quant.rating;
    if(QR){const o=r.quant.odds;out.push(CARD(['Analist notu',el('span',{class:'sp'}),el('a',{onclick:()=>tab('analist')},'Rapor →')],
      el('div',{class:'row'},el('span',{class:'lab3 l'+QR.idx,style:'font-size:12px;padding:4px 10px'},QR.label),el('span',{class:'mu'},'güven %'+QR.confidence),el('span',{class:'sp'}),
        QR.target?el('span',{class:'num'},'1 ay: ',el('b',{},fp(QR.target.base)),' ',el('span',{class:sgnc(QR.target.upside)},pct(QR.target.upside,1))):null),
      QR.target?el('div',{class:'kv',style:'margin-top:8px'},el('span',{},'%68 aralık (1 ay)'),el('b',{},fp(QR.target.low)+' – '+fp(QR.target.high))):null,
      o?el('div',{class:'kv'},el('span',{},'Hedef 1 stoptan önce'),el('b',{class:o.p1>=o.breakEven?'up':'dn'},'%'+nf(o.p1,0)+' (gereken %'+nf(o.breakEven,0)+')')):null))}
    out.push(planCard(P,r));
    out.push(CARD('Karar bileşenleri',el('div',{class:'cmp'},...V.components.flatMap(c=>{const w=Math.abs(c.impact)/Math.max(1,c.weight)*50;
      return [el('span',{title:c.why.join(' · ')},c.name),el('div',{class:'bar',title:c.why.join(' · ')},el('i',{style:(c.impact>=0?'left:50%;':'right:50%;')+'width:'+Math.min(50,w)+'%;background:'+(c.impact>=0?'var(--up)':'var(--dn)')})),
        el('b',{class:sgnc(c.impact)},(c.impact>0?'+':'')+c.impact)]}))));
    const T=P.trend,fr=r.frames||{};
    out.push(CARD('Zaman dilimleri',el('div',{class:'tfs'},...Object.keys(fr).sort((a,b)=>TFS.indexOf(a)-TFS.indexOf(b)).flatMap(k=>[el('span',{},TFN[k]||k),
      el('div',{},el('i',{class:'dot',style:'background:'+(fr[k].dir>0?'var(--up)':fr[k].dir<0?'var(--dn)':'var(--fg-3)')}),fr[k].text)])),
      el('div',{class:'kv',style:'margin-top:8px'},el('span',{},'Yapı'),el('b',{class:sgnc(T.structure.dir),style:'font-family:var(--font)'},T.structure.text),
        ...(T.trendlines||[]).flatMap(t=>[el('span',{},t.type==='destek'?'Yükselen destek çizgisi':'Alçalan direnç çizgisi'),el('b',{class:t.broken?(t.type==='destek'?'dn':'up'):''},fp(t.now)+(t.broken?' · kırıldı':''))]))));
    out.push(levelsCard(P,r));
    const Mo=P.momentum,Vo=P.volume,Vl=P.volatility,tp=T.primary||{};
    out.push(CARD('Göstergeler',el('div',{class:'kv'},
      el('span',{},'RSI (14)'),el('b',{class:Mo.rsi>=70?'dn':Mo.rsi<=30?'up':''},fin(Mo.rsi)?nf(Mo.rsi,1)+(Mo.rsi>=70?' · aşırı alım':Mo.rsi<=30?' · aşırı satım':''):'—'),
      el('span',{},'MACD histogram'),el('b',{class:sgnc(Mo.macdHist)},fin(Mo.macdHist)?nf(Mo.macdHist,3)+(Mo.macdCross?(Mo.macdCross>0?' · yukarı kesti':' · aşağı kesti'):''):'—'),
      el('span',{},'Stokastik RSI K/D'),el('b',{},fin(Mo.stochK)?Math.round(Mo.stochK)+' / '+Math.round(Mo.stochD):'—'),
      el('span',{},'ADX · +DI/−DI'),el('b',{},fin(tp.adx)?nf(tp.adx,0)+' · '+nf(tp.pdi,0)+'/'+nf(tp.mdi,0):'—'),
      el('span',{},'EMA 20 / 50 / 200'),el('b',{},[tp.ema20,tp.ema50,tp.ema200].map(fp).join(' / ')),
      el('span',{},'ATR (14)'),el('b',{},fin(Vl.atr)?fp(Vl.atr)+' · %'+nf(Vl.atrPct,2):'—'),

  S.st=st;S.tf=(st.prefs&&st.prefs.tf)||st.tf||'1g';S.mkt=st.market||'BIST';S.show={...(st.prefs&&st.prefs.show||{})};S.provider=(st.prefs&&st.prefs.provider)||'auto';
  S.scan=st.lastScan||null;badge();countAlarms();renderWatch();chartInit();
  load(st.symbol||st.watch[0]||'THYAO');refreshQuotes();
  if(st.prefs&&st.prefs.tab&&st.prefs.tab!=='grafik')tab(st.prefs.tab);
