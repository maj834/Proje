*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:400 12.5px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--fg-3)}.m2{color:var(--fg-2)}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r2);overflow:hidden;flex:none}
.seg button{height:26px;padding:0 9px;border:0;background:none;color:var(--fg-2);cursor:pointer;font:500 11.5px var(--mono)}

.chip.on{color:var(--fg);border-color:var(--fg-3);background:var(--sunk)}.chip:hover{color:var(--fg)}
.chip.sm{height:20px;padding:0 7px;font-size:10.5px;cursor:default}
.spin{width:22px;height:22px;border:2px solid var(--line-2);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.card{border:1px solid var(--line);border-radius:var(--r2);padding:12px;margin-bottom:10px;background:var(--bg)}
.card h3{margin:0 0 8px;font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);display:flex;align-items:center;gap:6px}
.card h3 .sp{flex:1}.card h3 a{font:500 11px var(--font);text-transform:none;letter-spacing:0;color:var(--acc);cursor:pointer}
.disc{font-size:10.5px;color:var(--fg-3);margin-top:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.kv>span{color:var(--fg-2);font-size:12px}.kv>b{font:500 12px var(--mono);text-align:right}
.inp{height:28px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--surface);outline:none;min-width:0}
.inp:focus{border-color:var(--acc)}
.btn{height:28px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r1);background:var(--surface);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--fg-3)}.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.btn.pri:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.5;cursor:default}
.warn{margin-top:8px;padding:7px 9px;border-radius:5px;background:var(--acc-soft);color:var(--fg);font-size:11.5px}
.err{padding:8px 10px;border-radius:5px;background:var(--dn-soft);color:var(--fg);font-size:12px}
.row{display:flex;gap:6px;align-items:center}
.pg{overflow:auto;padding:14px 18px 30px;min-height:0;height:100vh}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ph h2{margin:0;font:600 16px var(--font);margin-right:8px}
.prog{flex:1;min-width:120px;max-width:320px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.empty{padding:40px 20px;text-align:center;color:var(--fg-2)}.empty b{display:block;color:var(--fg);font-size:14px;margin-bottom:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mc{border:1px solid var(--line);border-radius:var(--r2);padding:12px;background:var(--surface)}
.mc>span{color:var(--fg-2);font-size:12px}.mc b{display:block;font:600 18px var(--mono);margin:2px 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toast{position:fixed;left:50%;top:56px;transform:translateX(-50%) translateY(-8px);opacity:0;pointer-events:none;transition:.15s;z-index:99;padding:9px 14px;border-radius:var(--r2);background:var(--fg);color:var(--bg);font-weight:500;max-width:60vw}
.toast.on{opacity:1;transform:translateX(-50%)}
</style></head>

    case 'list':return {ok:true,items:bos?[]:DERSLER,...stale};
    case 'get':{const d=DERSLER.find(x=>x.slug===a.slug);if(!d)return {ok:false,error:'İçerik bulunamadı.'};
      return {ok:true,item:{...d,ozet:d.ozet||d.baslik+' konusunu sade bir dille, BIST’ten örneklerle ele alıyoruz.',govde:DERS_GOVDE,video_meta:d.video_url?{platform:'YouTube',sure_sn:412}:null,kaynaklar:[{ad:'Takasbank',url:'https://www.takasbank.com.tr'},{ad:'Borsa İstanbul',url:'https://www.borsaistanbul.com'}]},...stale}}
    case 'quiz':return {ok:true,sorular:SORULAR.slice(0,a.n||10).map(pub)};
    case 'answer':{const x=SORULAR.find(s=>s.slug===a.slug),d=a.secim===x.dogru;const Q=prog.quiz;Q.toplam++;if(d){Q.dogru++;Q.seri++;Q.enIyi=Math.max(Q.enIyi,Q.seri)}else Q.seri=0;Q.oran=Math.round(Q.dogru/Q.toplam*100);
      const k=Q.konular[x.konu]||(Q.konular[x.konu]={n:0,dogru:0});k.n++;if(d)k.dogru++;k.oran=Math.round(k.dogru/k.n*100);
      return {ok:true,dogru:d,cevap:x.dogru,aciklama:x.aciklama,ders_slug:x.ders_slug,istatistik:JSON.parse(JSON.stringify(Q))}}
    case 'progress':return {ok:true,...JSON.parse(JSON.stringify(prog))};
    case 'markRead':if(!prog.okunan.includes(a.slug))prog.okunan.push(a.slug);return {ok:true,okunan:[...prog.okunan]};
    case 'sozluk':return {ok:true,items:bos?[]:SOZLUK,...stale};
    case 'ask':await wait(300);return {ok:true,cevap:'Çok yerinde bir soru, çünkü takas süresini bilmemek nakit planını bozabilir.\n\nŞöyle düşün: borsada alıcıyla satıcı birbirini tanımaz. Aradaki güveni **Takasbank** sağlar ve işlemi iki iş günü içinde kesinleştirir. Buna **T+2 takas** denir.\n\n- **T:** işlemi yaptığın gün\n- **T+2:** paranın ve hissenin kesin olarak el değiştirdiği gün\n\nÖrneğin Cuma günü sattığın bir hissenin parası, hafta sonu iş günü sayılmadığı için Salı günü çekilebilir.\n\nSence Çarşamba günü sattığın hissenin parası, Cuma resmî tatil olsaydı hangi gün hesabına geçerdi?'};
    case 'open':console.log('ac',a.url);return {ok:true};
  }
  return {ok:false,error:'Bilinmeyen işlem.'};
}};
let tT;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.className='toast on';clearTimeout(tT);tT=setTimeout(()=>e.className='toast',2400)}
try{localStorage.removeItem('bp.okul.tab')}catch{}
const v=document.getElementById('v');
let ui=BPOkul.render(v,api,{toast,go:s=>toast(s+' grafiği açılır'),sembol:()=>'THYAO'});
async function demo(tab,o={}){
  window.__ready=false;durum=o.durum||'';
  ui=BPOkul.render(v,api,{toast,go:s=>toast(s+' grafiği açılır'),sembol:()=>'THYAO'});
  await ui.show(tab);await wait(150);
  if(tab==='sor'&&o.sohbet!==false){const ta=document.querySelector('.ok-ta');ta.value='T+2 takas tam olarak ne demek? Sattığım hissenin parasını neden hemen çekemiyorum?';document.querySelector('.ok-compose .btn.pri').click();await wait(700)}
  if(tab==='sorular'&&o.quiz){document.querySelector('.ok-col .btn.pri').click();await wait(250);document.querySelectorAll('.ok-opt')[o.yanlis?0:2].click();await wait(250)}
  if(tab==='bugun'&&o.cevap){const o1=document.querySelectorAll('.ok-q')[0].querySelectorAll('.ok-opt');o1[2].click();await wait(150);const o2=document.querySelectorAll('.ok-q')[1].querySelectorAll('.ok-opt');o2[0].click();await wait(150)}
  if(tab==='dersler'&&o.ders){ui.openDers(o.ders);await wait(250)}
  if(tab==='sozluk'&&o.ara){const i=document.querySelector('.ok-srch input');i.value=o.ara;i.dispatchEvent(new Event('input'));await wait(250)}
  await painted();window.__ready=true;
}
const painted=()=>document.fonts.ready.then(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(r,200)))));
ui.show('bugun').then(painted).then(()=>{window.__ready=true});
