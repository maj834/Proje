<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:600 12px -apple-system,BlinkMacSystemFont,"Inter",sans-serif;-webkit-font-smoothing:antialiased}
.l{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed;opacity:0;transform:scaleX(.2);transform-origin:left;animation:ln .5s ease forwards}
.l:before{content:"";position:absolute;left:0;right:0;top:-6px;height:11px;background:linear-gradient(90deg,transparent,var(--c) 70%);opacity:.09}
.l span{position:absolute;left:28px;top:-12px;display:flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;color:#fff;background:var(--c);box-shadow:0 2px 10px rgba(0,0,0,.25);font-variant-numeric:tabular-nums;white-space:nowrap}
.l span i{font-style:normal;opacity:.75;font-weight:500}
@keyframes ln{to{opacity:.95;transform:none}}
.b{position:absolute;top:48px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:14px;color:#fff;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:bi .35s ease}
.b small{font-weight:500;opacity:.85}
@keyframes bi{from{opacity:0;transform:translate(-50%,-8px)}}
</style></head><body><script>
const BIAS={yukselis:['Yükseliş','#14a06b','▲'],dusus:['Düşüş','#e5484d','▼'],notr:['Nötr','#6b7482','●']};
const fmt=n=>typeof n==='number'?n.toLocaleString('tr-TR',{maximumFractionDigits:6}):null;
api.on('draw',a=>{
  document.body.replaceChildren();
  const add=(x,i,c,n)=>{if(typeof x.y!=='number'||x.y<0||x.y>1)return;
    const d=document.createElement('div'),s=document.createElement('span'),k=document.createElement('i');
    d.className='l';d.style.top=(x.y*100)+'%';d.style.borderColor=c;d.style.setProperty('--c',c);d.style.animationDelay=(i*80)+'ms';
    k.textContent=n;s.append(k,fmt(x.price)||'~');d.append(s);document.body.append(d)};
  (a.resistances||[]).forEach((x,i)=>add(x,i,'#e5484d','R'+(i+1)));
  (a.supports||[]).forEach((x,i)=>add(x,i+3,'#14a06b','S'+(i+1)));
  const [bl,c,ar]=BIAS[a.bias]||BIAS.notr,b=document.createElement('div'),sm=document.createElement('small');
  b.className='b';b.style.background=c+'e6';sm.textContent='Güven %'+a.confidence;
  b.append((a.symbol||'Grafik')+'  '+ar+' '+bl,sm);document.body.append(b);
});
</script></body></html>
