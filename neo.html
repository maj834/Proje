<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'">
<title>Neo</title><link rel="stylesheet" href="theme.css">
<style>
html,body{margin:0;color:var(--fg);font:400 13px/1.45 var(--font);-webkit-user-select:none;user-select:none}
/* ---- kure (ekranin ustunde) ---- */
body.orb{background:transparent;overflow:hidden}
.pill{margin:6px auto 0;width:396px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:22px;
  background:color-mix(in oklch,var(--bg) 88%,transparent);border:1px solid var(--line-2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);cursor:pointer}
.ball{width:38px;height:38px;border-radius:50%;flex:none;position:relative;background:radial-gradient(circle at 35% 30%,#9fd0ff,#4b6bff 55%,#2a1f7a);
  box-shadow:0 0 0 0 rgba(90,130,255,.5);transition:transform .08s linear}
.ball.thinking{animation:spin 1.1s linear infinite;background:conic-gradient(#7aa2ff,#b07aff,#ff7ab0,#7aa2ff)}
.ball.speaking{animation:pulse 1s ease-in-out infinite}
.ball.idle,.ball.off{opacity:.55}
.ball.err{background:radial-gradient(circle at 35% 30%,#ffb3a8,#e5484d 60%,#7a1f1f)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(90,130,255,.0);transform:scale(1.06)}}
.txt{flex:1;min-width:0}.st{font:600 11px var(--font);color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em}
.said{font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ans{font-size:13.5px;color:var(--fg);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* ---- pencere ---- */
body.app{background:var(--bg)}
.wrap{padding:16px 18px;display:flex;flex-direction:column;gap:12px;height:100vh;box-sizing:border-box}
.hd{display:flex;align-items:center;gap:12px}.hd h1{font:600 18px var(--font);margin:0}.hd .m{color:var(--fg-3);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.row{display:flex;align-items:center;gap:10px;padding:4px 0}.row .f{flex:1}.row .d{font-size:11.5px;color:var(--fg-3)}
.btn{border:1px solid var(--line-2);background:var(--bg);color:var(--fg);font:500 12.5px var(--font);padding:6px 12px;border-radius:7px;cursor:pointer}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input[type=text],select{font:13px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;-webkit-user-select:text;user-select:text}
input[type=text]{flex:1}
.log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.q{align-self:flex-end;background:var(--acc-soft);border-radius:12px 12px 2px 12px;padding:7px 10px;max-width:85%;-webkit-user-select:text;user-select:text}
.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:7px 10px;max-width:85%;-webkit-user-select:text;user-select:text}
.a small{display:block;color:var(--fg-3);font-size:10.5px;margin-top:3px}
.err{color:var(--dn);font-size:12px}.note{color:var(--fg-3);font-size:11.5px}
kbd{font:500 11px var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px}
</style></head><body>
<script>
const ORB=new URLSearchParams(location.search).get('orb')==='1';document.body.className=ORB?'orb':'app';
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ST={off:'Kapalı',idle:'"Hey Neo" de',listening:'Dinliyorum',thinking:'Düşünüyorum',speaking:'Konuşuyorum'};
const TOOL={open_feature:'Açıyorum',system_status:'Sisteme bakıyorum',set_app_volume:'Sesi ayarlıyorum',set_mac_volume:'Sesi ayarlıyorum',stock_info:'Hisseye bakıyorum',
  show_stock:'Borsayı açıyorum',set_timer:'Zamanlayıcı kuruyorum',open_app:'Uygulamayı açıyorum',open_url:'Sayfayı açıyorum',speed_test:'Hız testi yapıyorum',clipboard_search:'Panoda arıyorum',web_search:'İnternette arıyorum'};
if(ORB){
  const pill=el('div','pill'),ball=el('div','ball'),txt=el('div','txt'),st=el('div','st'),said=el('div','said'),ans=el('div','ans');
  txt.append(st,said,ans);pill.append(ball,txt);document.body.append(pill);
  pill.onclick=()=>neo.talk();
  neo.onOrb(d=>{ball.className='ball '+(d.error&&d.state==='off'?'err':d.state);
    st.textContent=d.error&&d.state==='off'?'Sorun':d.tool?(TOOL[d.tool]||'Çalışıyorum'):d.wake?'Dinliyorum':ST[d.state]||'';
    said.textContent=d.partial?'“'+d.partial+'”':'';ans.textContent=d.error&&!d.answer?d.error:d.answer||''});
  // Ses duzeyiyle kure buyur (-60..-10 dB)
  neo.onLevel(db=>{const k=Math.max(0,Math.min(1,(db+60)/50));ball.style.transform='scale('+(1+k*.35).toFixed(3)+')'});
}else{
  document.body.innerHTML=`<div class="wrap">
  <div class="hd"><div class="ball" id="b" style="width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9fd0ff,#4b6bff 55%,#2a1f7a)"></div>
    <div><h1>Neo</h1><div class="m" id="sub"></div></div></div>
  <div class="card">
    <div class="row"><div class="f">“Hey Neo” ile uyan<div class="d" id="wd"></div></div><label><input type="checkbox" id="wake"> Açık</label></div>
    <div class="row"><div class="f">Konuşmak için kısayol<div class="d">Uyandırma kelimesi demeden dinler; konuşurken basarsan susar.</div></div><kbd id="hk"></kbd></div>
    <div class="row"><div class="f">Ses</div><select id="voice" aria-label="Neo'nun sesi"></select></div>
    <div class="row"><div class="f">Beyin<div class="d" id="bd"></div></div><select id="brain" aria-label="Neo'nun beyni"><option value="groq">Groq (ücretsiz)</option><option value="claude">Claude (API anahtarı)</option></select></div>
    <div class="row"><input type="text" id="key" placeholder="" aria-label="API anahtarı" autocomplete="off" spellcheck="false"><button class="btn" id="ks">Kaydet</button><button class="btn" id="kl">Anahtar al</button></div>
    <div class="err" id="err" role="status"></div>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="row"><input type="text" id="q" placeholder="Yazarak sor… (ör. Spotify sesini yüzde 150 yap)" aria-label="Neo'ya yaz"><button class="btn pri" id="go">Sor</button>
    <button class="btn" id="mic" title="Sesle sor">🎙</button></div>
  <div class="row"><span class="note f">Uyandırma kelimesi Mac'te, internetsiz algılanır. Komutun seçtiğin beyne gider (Groq ya da Claude).</span><button class="btn" id="fg">Konuşmayı unut</button></div>
  </div>`;
  const $=id=>document.getElementById(id);let S=null;
  function render(){if(!S)return;const c=S.conf;
    $('sub').textContent=(ST[S.state]||'')+(S.hello?(S.hello.wakeOnDevice?' · uyandırma internetsiz':' · uyandırma için internet gerekiyor'):'');
    $('wake').checked=c.wake;$('wd').textContent=c.wake?'Mikrofon dinlemede; ekrandaki turuncu nokta bu yüzden.':'Kapalıyken yalnızca kısayolla dinler.';
    $('hk').textContent=c.hotkey.replace('Alt','⌥').replace('Space','Boşluk').replace(/\+/g,' ');
    const vs=(S.hello&&S.hello.voices)||[];$('voice').replaceChildren(el('option',null,'Varsayılan Türkçe ses'),...vs.map(v=>{const o=el('option',null,v.name+(v.quality&&v.quality!=='default'?' ('+v.quality+')':''));o.value=v.id;return o}));
    $('voice').options[0].value='';$('voice').value=c.voice||'';
    $('brain').value=c.brain;const g=c.brain==='groq';
    $('bd').textContent=g?'Ücretsiz, çok hızlı. Günlük ücretsiz sınırı var.':'En akıllısı; kullandıkça ücretli (claude.ai aboneliği bunu kapsamaz).';
    $('key').placeholder=(S.keys[c.brain]?'Kayıtlı · değiştirmek için yeni anahtarı yapıştır':g?'gsk_… Groq anahtarı':'sk-ant-… Claude API anahtarı');
    $('kl').style.display=g?'':'none';
    $('err').textContent=(S.keyError?S.keyError+' ':'')+(!S.hasKey?(g?'Groq anahtarı yok: "Anahtar al" → giriş yap → Create API Key → buraya yapıştır. ':'Claude API anahtarı yok. '):'')+(S.error||'')+(S.supported?'':' Neo yalnızca Mac\'te çalışır.');
    const L=$('log');L.replaceChildren(...[...S.log].reverse().flatMap(x=>{const a=el('div','a',x.a);if(x.tools&&x.tools.length)a.append(el('small',null,x.tools.map(t=>TOOL[t]||t).join(' · ')));return [el('div','q',x.q),a]}));L.scrollTop=L.scrollHeight}
  neo.on(s=>{S=s;render()});neo.state().then(s=>{if(s){S=s;render()}});
  $('wake').onchange=async()=>{S=await neo.set({wake:$('wake').checked})||S;render()};
  $('voice').onchange=async()=>{S=await neo.set({voice:$('voice').value})||S;render()};
  const ask=async()=>{const t=$('q').value.trim();if(!t)return;$('q').value='';$('go').disabled=true;S=await neo.ask(t)||S;$('go').disabled=false;render()};
  $('go').onclick=ask;$('q').onkeydown=e=>{if(e.key==='Enter')ask()};$('mic').onclick=()=>neo.talk();
  $('fg').onclick=async()=>{S=await neo.forget()||S;render()};
  $('brain').onchange=async()=>{S=await neo.set({brain:$('brain').value})||S;render()};
  $('ks').onclick=async()=>{const k=$('key').value.trim();S=await neo.key(S.conf.brain,k)||S;if(!S.keyError)$('key').value='';render()};
  $('kl').onclick=()=>neo.link();
}
</script></body></html>
