name: veri-topla
# Motor arastirmasi icin ham veri (fiyat 10y, bilanco ozeti, sermaye artirimi/temettu, KAP denemesi) -> tools/veri/ (brotli).
# GITHUB_TOKEN ile yapilan itme baska is akisini (build/surum) tetiklemez.
on:
  workflow_dispatch:
  push:
    paths: ['tools/veri-cek.js', 'tools/veri-cek-yahoo.py', '.github/workflows/veri.yml']
permissions:
  contents: read
concurrency: veri-topla-${{ github.sha }}
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SURE_DK: '35'
    strategy:
      fail-fast: false
      matrix:
        # Yahoo: curl_cffi (tarayici taklidi) ile Python; 5 parca ayri calistiricilarda
        cmd: ['python3 tools/veri-cek-yahoo.py 0 5', 'python3 tools/veri-cek-yahoo.py 1 5', 'python3 tools/veri-cek-yahoo.py 2 5',
              'python3 tools/veri-cek-yahoo.py 3 5', 'python3 tools/veri-cek-yahoo.py 4 5']
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet curl_cffi brotli
      - run: ${{ matrix.cmd }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: veri-${{ strategy.job-index }}
          path: tools/veri/
          retention-days: 3
  yaz:
    needs: cek
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: {path: tools/veri, merge-multiple: true}
      - run: |
          ls -la tools/veri
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/veri
          git commit -m "Motor arastirma verisi (veri-topla ${GITHUB_RUN_ID})" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done
          exit 1
